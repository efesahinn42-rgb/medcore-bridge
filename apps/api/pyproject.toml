[project]
name = "medcorebridge-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.115.1",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "cryptography>=46.0.7",
    "fastapi>=0.139.0",
    "google-generativeai>=0.8.6",
    "guardrails-ai>=0.10.2",
    "httpx>=0.28.1",
    "langfuse>=4.12.0",
    "openai>=2.44.0",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "sentry-sdk>=2.64.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
